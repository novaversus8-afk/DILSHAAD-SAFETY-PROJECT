/* =========================================================
   OPEN DATABASE
   ========================================================= */

function openDatabase(){

  return new Promise((resolve,reject)=>{

    const request =
      indexedDB.open(DB_NAME,DB_VERSION);

    request.onupgradeneeded = function(e){

      const database = e.target.result;

      if(!database.objectStoreNames.contains("data")){
        database.createObjectStore("data");
      }

    };

    request.onsuccess = function(e){

      db = e.target.result;

      resolve(db);

    };

    request.onerror = function(){

      reject(request.error);

    };

  });

}


/* =========================================================
   DATABASE SAVE
   ========================================================= */

function dbSave(key,value){

  return new Promise((resolve,reject)=>{

    const tx =
      db.transaction("data","readwrite");

    const store =
      tx.objectStore("data");

    const request =
      store.put(value,key);

    request.onsuccess =
      ()=>resolve(true);

    request.onerror =
      ()=>reject(request.error);

  });

}


/* =========================================================
   DATABASE GET
   ========================================================= */

function dbGet(key){

  return new Promise((resolve,reject)=>{

    const tx =
      db.transaction("data","readonly");

    const store =
      tx.objectStore("data");

    const request =
      store.get(key);

    request.onsuccess =
      ()=>resolve(request.result);

    request.onerror =
      ()=>reject(request.error);

  });

}

/* =========================================================
   SERVICE PHOTO
   ========================================================= */

function uploadServicePhoto(event,index){

  const file =
    event.target.files[0];

  if(!file) return;


  const url =
    URL.createObjectURL(file);


  services[index].image =
    url;


  document.getElementById(
    "preview-"+index
  ).src = url;


  /*
    Important:
    IndexedDB Blob में actual file save होगा.
  */

  services[index]._uploadedFile =
    file;

}


/* =========================================================
   SAVE SERVICE WITH FILE
   ========================================================= */

async function saveService(index){

  try{

    const description =
      document.getElementById(
        "description-"+index
      ).value.trim();


    services[index].description =
      description;


    const input =
      document.querySelector(
        `#description-${index}`
      )
      .parentElement
      .querySelector(
        'input[type="file"]'
      );


    if(
      input &&
      input.files &&
      input.files[0]
    ){

      const file =
        input.files[0];


      const blobURL =
        URL.createObjectURL(file);


      services[index].image =
        blobURL;


      services[index].file =
        file;

    }


    await dbSave(
      "services",
      services
    );


    /*
      File objects can be stored directly
      in IndexedDB.
    */


    renderServices();

    renderGallery();

    renderAdminServices();


    showToast(
      "✅ Service और Photo Save हो गई"
    );


  }catch(error){

    console.error(error);

    alert(
      "Photo Save नहीं हुई: " +
      error.message
    );

  }

}


/* =========================================================
   ESCAPE
   ========================================================= */

function escapeHTML(text){

  return String(text)
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* =========================================================
   TOAST
   ========================================================= */

function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  setTimeout(()=>{

    toast.classList.remove(
      "show"
    );

  },3000);

}
